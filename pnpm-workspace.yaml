allowBuilds:
  '@swc/core': true
  esbuild: true
  fsevents: true

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
#
# This must live here, not in .npmrc. pnpm only auto-enables STRICT soak mode when
# the setting comes from pnpm-workspace.yaml / config.yaml / CLI / env; a value in
# .npmrc runs in LOOSE mode, where a too-young package is silently appended to
# minimumReleaseAgeExclude and installed anyway. minimumReleaseAgeStrict is set
# explicitly so the enforcement does not depend on that inference.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
